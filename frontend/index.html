<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recruitment Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>AI Recruitment Assistant</h1>
        <p>Automated Candidate Screening and Evaluation</p>

        <button id="runBtn">Run Recruitment Process</button>
        <h2>Upload Candidate Resume</h2>

        <input type="file" id="resumeFile" accept=".pdf">

        <button id="uploadBtn">Upload and Analyse Resume</button>

        <div id="uploadStatus"></div>
        <div id="uploadResult"></div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
